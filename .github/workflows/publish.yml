name: Publish locally built image
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (v1.0.0)
        required: true
        type: string
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download locally built image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$VERSION" --repo "$REPOSITORY" --pattern 'container-amd64.tar.gz' --pattern 'CONTAINER-SHA256SUMS'
          sha256sum -c CONTAINER-SHA256SUMS
          docker load --input container-amd64.tar.gz
      - name: Publish to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "ghcr.io/codeaix/learning-portal:$VERSION"
          docker logout ghcr.io
